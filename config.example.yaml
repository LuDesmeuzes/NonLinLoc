# ═══════════════════════════════════════════════════════════════════════════
# Configuration du pipeline NLL
#
# Pour l'utiliser :
#   cp config.example.yaml config.yaml
#   puis adapter les chemins ci-dessous à votre machine.
#
# config.yaml n'est PAS versionné (voir .gitignore) car il contient des
# chemins propres à chaque poste de travail.
# ═══════════════════════════════════════════════════════════════════════════

paths:
  # Fichier du modèle de vitesse global (LON LAT DEPTH VP VS)
  model_file: "/path/to/Localisation/donnees/modele_vitesse/wet_new.asc"

  # Dossier racine contenant/recevant les tuiles
  tuiles_dir: "/path/to/Localisation/profils"

# ── Paramètres de segment_from_zones.py ─────────────────────────────────────
segment:
  # Séparateur du fichier modèle : "\s+" pour espaces/tabulations (.asc), "," pour CSV
  model_sep: '\s+'

  # Le fichier modèle a-t-il une ligne d'en-tête ?
  model_header: true

  # Profondeur en mètres dans le fichier modèle ? (true → conversion en km)
  depth_in_meters: true

  # Extension en altitude : nombre de km ajoutés au-dessus de la surface
  # (couches de -elev_step_km à -elevation_km km), et pas entre les couches
  elevation_km: 5
  elev_step_km: 1

  # Tolérance flottante pour la sélection géographique (degrés)
  tol: 0.001

  # Définition des zones/tuiles à découper. Une entrée par tuile :
  #   numero, nom, lon_min, lon_max, lat_min, lat_max : obligatoires
  #   depth_max_km : optionnel (absent/null → pas de limite de profondeur)
  # Le centre de projection AE est calculé automatiquement (centre géo de la zone).
  zones:
    - numero: 1
      nom: ubaye_topo
      lon_min: 6.11
      lon_max: 7.39
      lat_min: 44.06
      lat_max: 44.96
      depth_max_km: 30
    # - numero: 2
    #   nom: belledonne
    #   lon_min: 5.8
    #   lon_max: 6.4
    #   lat_min: 45.1
    #   lat_max: 45.6

# ── Paramètres de nll_pipeline.py ───────────────────────────────────────────
pipeline:
  # Utiliser le fichier _elevated.csv (true) ou _standard.csv (false) ?
  use_elevated: true

  # Pas d'interpolation cartésienne (km) — doit être identique à ce qui sera
  # utilisé dans le fichier .in de NLL
  step_km: 1

  # Les vitesses des CSV sont-elles en m/s ? (true → conversion en km/s)
  velocities_in_ms: true

  # Méthode d'interpolation scipy : "linear" (précis) ou "nearest" (rapide)
  interp_method: linear

  # Générer le fichier topo.asc (LOCTOPO_SURFACE) à partir du MNT SRTM1 ?
  generate_topo: true

  # Résolution de la grille topo en degrés (SRTM1 natif ≈ 0.000278°/30 m ;
  # 0.001-0.005° est un bon compromis pour NLL)
  topo_step_deg: 0.001

# ── Paramètres de seiscomp_xml_to_obs.py ────────────────────────────────────
phases:
  # Dossiers d'exports XML SeisComP (un fichier par événement) à convertir.
  # Un fichier <nom_du_dossier>.obs est écrit pour chacun.
  xml_dirs:
    - "/path/to/Localisation/donnees/pointes/xml_seiscomp/1_ubaye_v3"

  # Dossier de sortie des fichiers NLLOC_OBS
  output_dir: "/path/to/Localisation/donnees/pointes/nll_obs"

  # Incertitude (s) des pointés qui n'en ont pas dans le XML (pointés
  # automatiques). À aligner sur NonLinLoc.defaultPickError de SeisComP.
  default_error_s: {P: 0.02, S: 0.02}

# ── Paramètres de fetch_picks.py ────────────────────────────────────────────
fetch:
  # Service web fdsnws-event du serveur SeisComP
  fdsnws_url: "http://ist-sc3-sig.u-ga.fr:8080/fdsnws/event/1/query"

  # Zone des événements à récupérer (degrés). Celle-ci couvre les
  # événements du run SeisComP 1D_ubaye_v2.
  zone: {lat_min: 44.40, lat_max: 44.63, lon_min: 6.59, lon_max: 6.92}

  # Types d'événements gardés (null → tous)
  event_types: [earthquake]

  # Dossier des XML journaliers (cache : une journée n'est téléchargée qu'une fois)
  cache_dir: "/path/to/Localisation/donnees/pointes/xml_seiscomp/par_jour"

  # Dossier des fichiers de pointés periode_<debut>_<fin>.obs
  obs_dir: "/path/to/Localisation/donnees/pointes/nll_obs"

# ── Paramètres de nll_run.py ────────────────────────────────────────────────
run:
  # Dossier des profils : un sous-dossier par profil, avec NLL.<profil>.conf
  # (copie de la configuration SeisComP) et time/ (grilles de temps)
  profils_dir: "/path/to/Localisation/profils"

  # Dossier où chaque run crée son sous-dossier <nom>/
  runs_dir: "/path/to/Localisation/runs"

  # Binaire NLLoc
  nlloc: "/path/to/Localisation/outils/bin/NLLoc"
